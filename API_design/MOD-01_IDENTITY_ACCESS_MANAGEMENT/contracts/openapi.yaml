openapi: 3.1.0
info:
  title: Drone RL Training Platform - MOD-01 Identity & Access API
  version: 0.1.0
  description: >-
    Hợp đồng REST chỉ cho MOD-01: authentication/session, account administration,
    role catalog và project-scoped membership. project_id là opaque scope reference;
    API này không quản lý project hoặc bất kỳ tài nguyên nghiệp vụ nào của module khác.
servers:
  - url: /
tags:
  - name: Authentication
  - name: Accounts
  - name: Roles
  - name: Memberships
paths:
  /api/v1/auth/sessions:
    post:
      tags: [Authentication]
      operationId: createAuthSession
      summary: Đăng nhập và tạo server-side session
      security: []
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Session được tạo; session secret chỉ nằm trong Set-Cookie.
          headers:
            Set-Cookie:
              description: >-
                __Host-drone_rl_session với Secure, HttpOnly, SameSite=Strict,
                Path=/ và không có Domain. Giá trị không được log.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStoreHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentIdentity
      summary: Lấy identity context hiện tại
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Identity đã xác thực, chỉ gồm trường cần cho client.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/csrf-token:
    get:
      tags: [Authentication]
      operationId: issueCsrfToken
      summary: Cấp CSRF token cho session hiện tại
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Token phải gửi lại trong X-CSRF-Token cho mutation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password:
    put:
      tags: [Authentication]
      operationId: changeCurrentPassword
      summary: Đổi password của account hiện tại
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Password đã đổi; session hiện tại và CSRF secret được rotate, các session khác bị thu hồi.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStoreHeader'
            Set-Cookie:
              description: Cookie session mới; cookie cũ không còn hợp lệ.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRotated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/sessions/current:
    delete:
      tags: [Authentication]
      operationId: revokeCurrentSession
      summary: Đăng xuất và thu hồi session hiện tại
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: Session đã thu hồi. Request lặp bằng session đã revoke trả 401.
          headers:
            Clear-Site-Data:
              description: Có thể dùng để xóa cache/cookie/storage theo deployment policy.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStoreHeader'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'

  /api/v1/admin/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Liệt kê account theo quyền quản trị IAM
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: query
          in: query
          description: Tìm username/email/display name theo policy search đã allowlist.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Trang account có thứ tự ổn định.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Tạo account local do Platform Administrator quản lý
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
      responses:
        '201':
          description: Account được tạo.
          headers:
            Location:
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Xem account theo quyền quản trị IAM
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Account representation không chứa secret/hash.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Cập nhật display name hoặc trạng thái account
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatchHeader'
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: Account đã cập nhật.
          headers:
            ETag:
              $ref: '#/components/headers/ETagHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/accounts/{account_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    delete:
      tags: [Accounts]
      operationId: revokeAccountSessions
      summary: Thu hồi toàn bộ session của một account
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: Mọi session active đã bị thu hồi; thao tác lặp an toàn.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/iam/roles:
    get:
      tags: [Roles]
      operationId: listRoleDefinitions
      summary: Liệt kê role catalog versioned, chỉ đọc
      security:
        - CookieAuth: []
      parameters:
        - name: scope_type
          in: query
          schema:
            $ref: '#/components/schemas/RoleScopeType'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Role catalog; không có endpoint custom role CRUD.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/iam/global-role-bindings:
    get:
      tags: [Roles]
      operationId: listGlobalRoleBindings
      summary: Liệt kê global Platform Administrator bindings
      security:
        - CookieAuth: []
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Trang global role binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRoleBindingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Roles]
      operationId: createGlobalRoleBinding
      summary: Gán role platform_admin cho account active
      description: Yêu cầu Platform Administrator có recent authentication.
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalRoleBindingCreate'
      responses:
        '201':
          description: Global role binding được tạo.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRoleBinding'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/iam/global-role-bindings/{binding_id}:
    parameters:
      - $ref: '#/components/parameters/BindingId'
    delete:
      tags: [Roles]
      operationId: revokeGlobalRoleBinding
      summary: Thu hồi một global Platform Administrator binding
      description: >-
        Yêu cầu recent authentication và không được thu hồi Platform Administrator
        active cuối cùng.
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: Binding đã revoked; record lịch sử không bị xóa vật lý.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/iam/project-memberships:
    get:
      tags: [Memberships]
      operationId: listProjectMemberships
      summary: Liệt kê role binding theo project scope
      security:
        - CookieAuth: []
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: account_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MembershipStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Trang membership; không trả project metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Memberships]
      operationId: createProjectMembership
      summary: Gán project-scoped role cho account
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreate'
      responses:
        '201':
          description: Membership được tạo.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/iam/project-memberships/{membership_id}:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [Memberships]
      operationId: getProjectMembership
      summary: Xem một project role binding
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: Membership representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Memberships]
      operationId: revokeProjectMembership
      summary: Thu hồi project role binding
      security:
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '204':
          description: Membership đã revoked; thao tác lặp an toàn.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: __Host-drone_rl_session
      description: Opaque server-side session cookie; không phải JWT.

  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingId:
      name: binding_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: Phải khớp same-origin hoặc deployment allowlist.
      schema:
        type: string
        format: uri
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Synchronizer token gắn với session hiện tại.
      schema:
        type: string
        minLength: 32
        maxLength: 512
    CorrelationIdHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Client có thể gửi; server validate hoặc tự tạo.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: Weak ETag từ account version hiện tại.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  headers:
    NoStoreHeader:
      description: Phản hồi nhạy cảm không được cache.
      schema:
        type: string
        const: no-store
    ETagHeader:
      description: Weak ETag biểu diễn version hiện tại.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Thiếu session hoặc session/account không còn hợp lệ.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStoreHeader'
        WWW-Authenticate:
          description: Challenge cho opaque cookie session profile.
          schema:
            type: string
            const: 'Session realm="drone-rl-platform"'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: Credential không hợp lệ; không tiết lộ account có tồn tại.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStoreHeader'
        WWW-Authenticate:
          description: Challenge cho opaque cookie session profile.
          schema:
            type: string
            const: 'Session realm="drone-rl-platform"'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Actor đã xác thực nhưng không có capability IAM cần thiết.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfRejected:
      description: Origin hoặc CSRF token không hợp lệ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Tài nguyên không tồn tại hoặc không được phép tiết lộ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Unique binding/account conflict hoặc semantic duplicate.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match không còn khớp version hiện tại.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request không đạt validation/business precondition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    RateLimited:
      description: Vượt login/thao tác threshold theo policy.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Dependency bắt buộc không sẵn sàng; hệ thống không fail-open.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true

    SessionCreated:
      type: object
      additionalProperties: false
      required: [account, expires_at]
      properties:
        account:
          $ref: '#/components/schemas/CurrentIdentity'
        expires_at:
          type: string
          format: date-time

    SessionRotated:
      type: object
      additionalProperties: false
      required: [csrf_token, expires_at]
      properties:
        csrf_token:
          type: string
          minLength: 32
          maxLength: 512
        expires_at:
          type: string
          format: date-time

    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 32
          maxLength: 512

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true

    AccountStatus:
      type: string
      enum: [active, locked, disabled]

    AccountCreate:
      type: object
      additionalProperties: false
      required: [username, email, display_name, initial_password]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        initial_password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true

    AccountPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/AccountStatus'

    Account:
      type: object
      additionalProperties: false
      required:
        [id, username, email, display_name, status, must_change_password, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        must_change_password:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccountPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    RoleScopeType:
      type: string
      enum: [global, project]

    RoleDefinition:
      type: object
      additionalProperties: false
      required: [code, name, scope_type, description, permissions, catalog_version]
      properties:
        code:
          type: string
          enum:
            [platform_admin, researcher, lecturer, learner, algorithm_developer]
        name:
          type: string
        scope_type:
          $ref: '#/components/schemas/RoleScopeType'
        description:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        catalog_version:
          type: string

    GlobalRoleBindingCreate:
      type: object
      additionalProperties: false
      required: [account_id, role_code]
      properties:
        account_id:
          type: string
          format: uuid
        role_code:
          type: string
          const: platform_admin

    GlobalRoleBinding:
      type: object
      additionalProperties: false
      required: [id, account_id, role_code, status, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        role_code:
          type: string
          const: platform_admin
        status:
          $ref: '#/components/schemas/MembershipStatus'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        revoked_by:
          type: [string, 'null']
          format: uuid
        revoked_at:
          type: [string, 'null']
          format: date-time

    GlobalRoleBindingPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GlobalRoleBinding'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    MembershipStatus:
      type: string
      enum: [active, revoked]

    MembershipCreate:
      type: object
      additionalProperties: false
      required: [project_id, account_id, role_code]
      properties:
        project_id:
          type: string
          format: uuid
          description: Opaque scope reference; không tạo/sửa project.
        account_id:
          type: string
          format: uuid
        role_code:
          type: string
          enum: [researcher, lecturer, learner, algorithm_developer]

    ProjectMembership:
      type: object
      additionalProperties: false
      required:
        [id, project_id, account_id, role_code, status, created_by, created_at, version]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        role_code:
          type: string
          enum: [researcher, lecturer, learner, algorithm_developer]
        status:
          $ref: '#/components/schemas/MembershipStatus'
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        revoked_by:
          type: [string, 'null']
          format: uuid
        revoked_at:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 1

    MembershipPage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMembership'
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    CurrentIdentity:
      type: object
      additionalProperties: false
      required: [id, username, display_name, must_change_password, global_roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        must_change_password:
          type: boolean
        global_roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [platform_admin]

    ProblemBase:
      type: object
      required: [type, title, status, code, correlation_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        correlation_id:
          type: string

    Problem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
      unevaluatedProperties: false

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemBase'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
      unevaluatedProperties: false

